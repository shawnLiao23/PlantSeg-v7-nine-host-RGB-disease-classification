[build-system]
requires = ["setuptools>=65", "wheel>=0.40"]
build-backend = "setuptools.build_meta"

[project]
name = "aip304-plantseg-cw2"
version = "0.1.0"
description = "Reproducible PlantSeg v7 host-disease classification coursework"
requires-python = ">=3.10"
dependencies = [
  "torch>=2.3,<3",
  "torchvision>=0.18,<1",
  "numpy>=1.24",
  "Pillow>=10",
  "matplotlib>=3.7",
]

[project.scripts]
aip304-experiments = "plantseg_cw2.run_experiments:main"
aip304-infer = "plantseg_cw2.inference:main"

[tool.setuptools.packages.find]
where = ["code"]
include = ["plantseg_cw2*"]
